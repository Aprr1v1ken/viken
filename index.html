<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#060a16" />
    <title>SYSJEGER V2.0 — SIM-Gereja GMIT Betel Fuimelang</title>
    <meta name="description" content="Situs web dan Sistem Informasi Manajemen Jemaat dan Gereja GMIT Betel Fuimelang, Klasis Alor Tengah Utara, NTT. Administrasi jemaat, kartu keluarga, rayon, sakramen, warta, absensi, jadwal ibadah, dan kas gereja." />
    <meta property="og:title" content="SYSJEGER V2.0 — SIM-Gereja GMIT Betel Fuimelang" />
    <meta property="og:description" content="Situs web dan Sistem Informasi Manajemen Jemaat dan Gereja GMIT Betel Fuimelang, Klasis Alor Tengah Utara, Nusa Tenggara Timur." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html { background: #060a16; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Layar muat awal: diganti otomatis begitu aplikasi React berjalan.
           Menjamin halaman tidak pernah tampil putih polos saat JS dimuat. -->
      <div data-boot style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060a16;color:#fcd34d;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:24px;box-sizing:border-box">
        <div style="text-align:center;max-width:420px">
          <div style="font-size:34px;line-height:1;margin-bottom:12px" aria-hidden="true">✝️</div>
          <div style="font-weight:800;letter-spacing:.04em;font-size:16px">SYSJEGER V2.0</div>
          <div style="color:#94a3b8;font-size:13px;margin-top:6px;line-height:1.6">
            Memuat situs GMIT Betel Fuimelang…<br>
            Bila halaman tidak berubah dalam ±15 detik, periksa koneksi internet Anda lalu muat ulang halaman ini.
          </div>
        </div>
      </div>
    </div>
    <script>
      // Jala pengaman: bila JavaScript aplikasi gagal dimuat, tampilkan pesan
      // yang jelas (bukan layar putih) agar mudah dilaporkan/didiagnosis.
      window.addEventListener('error', function (e) {
        var boot = document.querySelector('[data-boot]');
        if (!boot) return;
        var detail = (e && e.message) ? String(e.message) : 'berkas aplikasi gagal dimuat';
        boot.innerHTML = '';
        var box = document.createElement('div');
        box.style.cssText = 'text-align:center;max-width:460px;color:#fca5a5;font-size:13px;line-height:1.7';
        var title = document.createElement('div');
        title.textContent = '⚠️ Situs gagal dimuat';
        title.style.cssText = 'font-weight:800;font-size:16px;color:#fecaca;margin-bottom:8px';
        var msg = document.createElement('div');
        msg.textContent = 'Silakan muat ulang halaman ini. Bila masih gagal, sampaikan pesan berikut kepada pengelola: ' + detail;
        var btn = document.createElement('button');
        btn.textContent = 'Muat Ulang Halaman';
        btn.style.cssText = 'margin-top:14px;padding:10px 18px;border:0;border-radius:10px;background:#f59e0b;color:#0f172a;font-weight:800;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        box.appendChild(title); box.appendChild(msg); box.appendChild(btn);
        boot.appendChild(box);
      }, true);
    </script>
    <noscript>Situs SYSJEGER GMIT Betel Fuimelang membutuhkan JavaScript. Mohon aktifkan JavaScript pada peramban Anda.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
